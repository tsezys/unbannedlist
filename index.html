<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Unblocked</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background: #000;
      color: #fff;
      min-height: 100vh;
      line-height: 1.45;
    }

    header {
      border-bottom: 1px solid #222;
      padding: 1rem 1.25rem;
      position: sticky;
      top: 0;
      background: #000;
      z-index: 10;
    }

    .header-inner {
      max-width: 960px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .logo {
      font-weight: 700;
      font-size: 1.1rem;
      letter-spacing: -0.02em;
      color: #fff;
      text-decoration: none;
    }

    .count {
      font-size: 0.8rem;
      color: #666;
    }

    main {
      max-width: 960px;
      margin: 0 auto;
      padding: 1.5rem 1.25rem 3rem;
    }

    .search {
      margin-bottom: 1.25rem;
    }

    .search input {
      width: 100%;
      background: #111;
      border: 1px solid #333;
      color: #fff;
      padding: 0.65rem 0.9rem;
      font-size: 0.95rem;
      border-radius: 6px;
      outline: none;
    }

    .search input:focus {
      border-color: #555;
    }

    .search input::placeholder {
      color: #555;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-bottom: 1.5rem;
    }

    .tag {
      background: transparent;
      border: 1px solid #333;
      color: #888;
      padding: 0.25rem 0.7rem;
      font-size: 0.8rem;
      border-radius: 999px;
      cursor: pointer;
    }

    .tag:hover,
    .tag.active {
      border-color: #fff;
      color: #fff;
    }

    .list {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .card {
      display: block;
      background: #0a0a0a;
      border: 1px solid #222;
      border-radius: 8px;
      padding: 1rem 1.1rem;
      text-decoration: none;
      color: inherit;
      transition: border-color 0.15s;
    }

    .card:hover {
      border-color: #444;
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 0.75rem;
      margin-bottom: 0.25rem;
    }

    .card h2 {
      font-size: 1rem;
      font-weight: 600;
    }

    .card .url {
      font-size: 0.75rem;
      color: #555;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 45%;
    }

    .card p {
      font-size: 0.875rem;
      color: #888;
      margin-bottom: 0.5rem;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      align-items: center;
    }

    .meta .t {
      font-size: 0.7rem;
      color: #666;
      border: 1px solid #2a2a2a;
      padding: 0.1rem 0.45rem;
      border-radius: 4px;
    }

    .blocked {
      font-size: 0.7rem;
      color: #999;
      margin-left: auto;
    }

    .blocked span {
      color: #666;
    }

    .empty {
      text-align: center;
      padding: 3rem 1rem;
      color: #555;
      font-size: 0.9rem;
    }

    footer {
      border-top: 1px solid #222;
      text-align: center;
      padding: 1.25rem;
      font-size: 0.75rem;
      color: #444;
    }

    @media (max-width: 500px) {
      .card .url {
        display: none;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <a href="/" class="logo">Unblocked</a>
      <span class="count" id="count"></span>
    </div>
  </header>

  <main>
    <div class="search">
      <input type="text" id="q" placeholder="Search..." autocomplete="off" />
    </div>

    <div class="tags" id="tags"></div>

    <div class="list" id="list">
      <div class="empty">Loading...</div>
    </div>
  </main>

  <footer>
    Edit config.json to add or update links
  </footer>

  <script>
    let links = [];
    let activeTag = "all";

    const listEl = document.getElementById("list");
    const tagsEl = document.getElementById("tags");
    const qEl = document.getElementById("q");
    const countEl = document.getElementById("count");

    async function load() {
      try {
        const res = await fetch("config.json?t=" + Date.now());
        if (!res.ok) throw new Error("failed");
        const data = await res.json();
        document.title = data.siteTitle || "Unblocked";
        document.querySelector(".logo").textContent = data.siteTitle || "Unblocked";
        links = data.links || [];
        buildTags();
        render();
      } catch (e) {
        listEl.innerHTML = `<div class="empty">Could not load config.json</div>`;
      }
    }

    function buildTags() {
      const set = new Set();
      links.forEach(l => (l.tags || []).forEach(t => set.add(t)));
      const all = ["all", ...Array.from(set).sort()];

      tagsEl.innerHTML = all.map(t => {
        const label = t === "all" ? "All" : t;
        return `<button class="tag ${t === activeTag ? "active" : ""}" data-t="${t}">${label}</button>`;
      }).join("");

      tagsEl.querySelectorAll(".tag").forEach(btn => {
        btn.onclick = () => {
          activeTag = btn.dataset.t;
          tagsEl.querySelectorAll(".tag").forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
          render();
        };
      });
    }

    function render() {
      const q = qEl.value.trim().toLowerCase();

      const filtered = links.filter(l => {
        const tagOk = activeTag === "all" || (l.tags || []).includes(activeTag);
        const searchOk = !q ||
          l.title.toLowerCase().includes(q) ||
          (l.description || "").toLowerCase().includes(q) ||
          (l.tags || []).some(t => t.toLowerCase().includes(q));
        return tagOk && searchOk;
      });

      countEl.textContent = filtered.length + " link" + (filtered.length !== 1 ? "s" : "");

      if (!filtered.length) {
        listEl.innerHTML = `<div class="empty">No results</div>`;
        return;
      }

      listEl.innerHTML = filtered.map(l => {
        const blocked = (l.blockedBy && l.blockedBy.length)
          ? `<div class="blocked">blocked by <span>${esc(l.blockedBy.join(", "))}</span></div>`
          : "";

        return `
          <a class="card" href="${esc(l.url)}" target="_blank" rel="noopener">
            <div class="card-top">
              <h2>${esc(l.title)}</h2>
              <span class="url">${esc(l.url.replace(/^https?:\/\//, ""))}</span>
            </div>
            <p>${esc(l.description || "")}</p>
            <div class="meta">
              ${(l.tags || []).map(t => `<span class="t">${esc(t)}</span>`).join("")}
              ${blocked}
            </div>
          </a>
        `;
      }).join("");
    }

    function esc(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    qEl.addEventListener("input", render);
    load();
  </script>
</body>
</html>
